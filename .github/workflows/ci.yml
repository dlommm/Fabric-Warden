# Fabric Warden CI: backend tests and lint, web typecheck/lint/build, browser E2E.
# On main, once those pass, release-please keeps a release pull request open with the
# next version (from Conventional Commit messages) and changelog; merging it tags
# vX.Y.Z, creates the GitHub release and publishes the Docker image as :X.Y.Z and :latest.
# Tests use no secrets: every test runs against SQLite and the built-in simulators;
# nothing contacts a real controller, device or AI endpoint. Only the publish job
# reads the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; a push to main always finishes publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.19"
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"
  PNPM_VERSION: "12.6.0"

jobs:
  api:
    name: API tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Tests
        run: uv run pytest -q

  web:
    name: Web typecheck, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  e2e:
    name: Browser E2E (simulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
        working-directory: apps/api
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run E2E
        run: pnpm e2e
        working-directory: apps/web
        env:
          CI: "true"
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [api, web, e2e]
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    name: Publish Docker image
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [release]
    env:
      IMAGE: dendlomm/fabric-warden
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version files
        run: |
          api=$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/api/pyproject.toml | head -1)
          web=$(node -p "require('./apps/web/package.json').version")
          if [ "$api" != "$VERSION" ] || [ "$web" != "$VERSION" ]; then
            echo "::error::Release $VERSION but pyproject.toml has '$api' and package.json '$web'"; exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
