[project]
name = "warden"
version = "1.0.0rc1"
description = "Fabric Warden API: self-hosted modular network operations platform"
license = "AGPL-3.0-or-later"
authors = [
    { name = "dlomm", email = "118149483+dlommm@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.156.4",
    "httpx>=0.28.1",
    "pydantic[email]>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyotp>=2.10.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2",
    "uvicorn[standard]>=0.54.0",
    "pysnmp>=7.1.30",
]

[project.scripts]
warden = "warden.main:run"
warden-backup = "warden.backup_cli:main"
warden-admin = "warden.admin_cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"src/warden/migrations/versions/*" = ["E501"]
"src/warden/api/controllers.py" = ["E501"]
