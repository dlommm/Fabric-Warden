# Fabric Warden: core installation.
#   cp deploy/.env.example deploy/.env   # then edit secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
# Open http://<host>:${WARDEN_HTTP_PORT:-8080} and complete first-run setup.
# Images are pinned by version and digest; see docs/DEPLOYMENT.md for upgrades.
name: fabric-warden

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    <<: *hardening
    image: postgres:17.11-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
    environment:
      POSTGRES_DB: warden
      POSTGRES_USER: warden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warden -d warden"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    <<: *hardening
    image: redis:7.4.11-alpine@sha256:892022f9f18c26c92c30e15194d132f90044af87b94a491a75429bbc3982eab1
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    <<: *hardening
    build: ../apps/api
    image: fabric-warden/api:1.0.0-rc.1
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      WARDEN_DATABASE_URL: postgresql+asyncpg://warden:${POSTGRES_PASSWORD}@db:5432/warden
      WARDEN_REDIS_URL: redis://redis:6379/0
      WARDEN_SECRET_KEY: ${WARDEN_SECRET_KEY:?set WARDEN_SECRET_KEY in deploy/.env}
      WARDEN_COOKIE_SECURE: ${WARDEN_COOKIE_SECURE:-true}
      WARDEN_DEMO_CONTROLLER_ENABLED: ${WARDEN_DEMO_CONTROLLER_ENABLED:-true}
      # 1 only behind a TLS reverse proxy that sets X-Forwarded-For (DEPLOYMENT.md).
      WARDEN_FORWARDED_HOPS: ${WARDEN_FORWARDED_HOPS:-0}
      WARDEN_SYSLOG_PORT: "5514"
    volumes:
      - data:/data
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    # The HTTP API is not published: only the web container talks to it.
    # Syslog (UDP) is published on localhost only; set WARDEN_SYSLOG_BIND=0.0.0.0
    # in deploy/.env to receive logs from your gateway and servers.
    ports:
      - "${WARDEN_SYSLOG_BIND:-127.0.0.1}:${WARDEN_SYSLOG_HOST_PORT:-5514}:5514/udp"

  web:
    <<: *hardening
    build:
      context: ../apps/web
      args:
        WARDEN_API_URL: http://api:8000
    image: fabric-warden/web:1.0.0-rc.1
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache:uid=10001,mode=0700"]
    cap_drop: [ALL]
    ports:
      - "${WARDEN_HTTP_PORT:-8080}:3000"

volumes:
  db:
  data:
